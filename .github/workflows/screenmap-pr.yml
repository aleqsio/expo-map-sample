# .github/workflows/screenmap-pr.yml — review what a PR changes on-screen
name: screenmap · PR changes
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: screenmap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write        # push bundles to the screenmaps branch (set publish: false to drop this)
  pull-requests: write   # sticky comment
jobs:
  changes:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aleqsio/expo-map@main
        with:
          mode: pr
          agent_api_key: ${{ secrets.AGENT_API_KEY }}   # opencode key — omit for deterministic-only
          agent_provider: opencode
          expo_token: ${{ secrets.EXPO_TOKEN }}   # EAS builds/serves the dev client
          # project: apps/mobile
          # publish: "false"   # private repos that only want the artifact link
